name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  # ── Linux x86-64 ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/n1mm_bridge
          cp target/release/n1mm_bridge dist/n1mm_bridge/
          cp README.md                  dist/n1mm_bridge/
          cp LICENSE                    dist/n1mm_bridge/
          cd dist
          tar -czf ../n1mm_bridge-linux-x86_64.tar.gz n1mm_bridge

      - uses: actions/upload-artifact@v4
        with:
          name: n1mm_bridge-linux-x86_64
          path: n1mm_bridge-linux-x86_64.tar.gz

  # ── macOS aarch64 (Apple Silicon) ────────────────────────────────────────────
  build-macos-arm:
    name: Build – macOS aarch64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-aarch64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/n1mm_bridge
          cp target/release/n1mm_bridge dist/n1mm_bridge/
          cp README.md                  dist/n1mm_bridge/
          cp LICENSE                    dist/n1mm_bridge/
          cd dist
          tar -czf ../n1mm_bridge-macos-aarch64.tar.gz n1mm_bridge

      - uses: actions/upload-artifact@v4
        with:
          name: n1mm_bridge-macos-aarch64
          path: n1mm_bridge-macos-aarch64.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/n1mm_bridge-linux-x86_64/n1mm_bridge-linux-x86_64.tar.gz
            artifacts/n1mm_bridge-macos-aarch64/n1mm_bridge-macos-aarch64.tar.gz
